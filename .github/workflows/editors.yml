name: SufiBlazor editors

on:
  push:
    paths:
      - "frontend/**"
      - "src/SufiChain.SufiBlazor/wwwroot/_sufi/editors/**"
      - "src/SufiChain.SufiBlazor/wwwroot/sufiblazor-editors.css"
  pull_request:
    paths:
      - "frontend/**"
      - "src/SufiChain.SufiBlazor/wwwroot/_sufi/editors/**"
      - "src/SufiChain.SufiBlazor/wwwroot/sufiblazor-editors.css"

jobs:
  check-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
