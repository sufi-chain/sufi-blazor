name: SufiBlazor editors

on:
  workflow_dispatch:

jobs:
  check-bundles:
    runs-on: [self-hosted, linux, x64, sufi-build]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
