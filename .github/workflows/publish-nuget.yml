name: Publish NuGet Packages to nuget.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_version:
        description: "SemVer package version (required for manual runs). Example: 1.2.3 or 1.2.3-beta.1"
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_VERSION: "10.0.x"
  NUGET_ORG_SOURCE_URL: https://api.nuget.org/v3/index.json
  NUGET_PUSH_PARALLELISM: "4"
  PACKAGE_OUTPUT: ./artifacts/nuget
  PACKAGE_PROJECTS: >-
    src/SufiChain.SufiBlazor/SufiChain.SufiBlazor.csproj
    src/SufiChain.SufiBlazor.Demo.Localization/SufiChain.SufiBlazor.Demo.Localization.csproj
    src/SufiChain.SufiBlazor.Demo/SufiChain.SufiBlazor.Demo.csproj

concurrency:
  group: publish-nuget-org-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Write CI NuGet.config
        shell: bash
        run: |
          set -euo pipefail
          cat > NuGet.Config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF
          # Strip leading YAML indentation from the generated config.
          sed -i 's/^[[:space:]]*//' NuGet.Config

      - name: Resolve package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG:-}" ]; then
            version="$RELEASE_TAG"
          elif [ -n "${INPUT_PACKAGE_VERSION:-}" ]; then
            version="$INPUT_PACKAGE_VERSION"
          else
            echo "Package version is required." >&2
            exit 1
          fi
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+([.][0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?([+][0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid NuGet package version: $version" >&2
            echo "Use SemVer like 1.2.3, 1.2.3-beta.1, or v1.2.3." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Restore, build and pack packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package_dir="${PACKAGE_OUTPUT%/}/${VERSION}"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          for project in $PACKAGE_PROJECTS; do
            if [ ! -f "$project" ]; then
              echo "Package project does not exist: $project" >&2
              exit 1
            fi
            echo "Packing $project"
            dotnet restore "$project" --verbosity minimal -p:NuGetAudit=false
            dotnet build "$project" \
              --configuration Release \
              --no-restore \
              --verbosity minimal \
              -m \
              -p:PackageVersion="$VERSION" \
              -p:ContinuousIntegrationBuild=true \
              -p:BuildInParallel=true \
              -p:PackageOutputPath="$(pwd)/$package_dir" \
              -p:GeneratePackageOnBuild=true
          done

          find "$package_dir" -type f -name '*.nupkg' ! -name '*.symbols.nupkg' ! -name "*.${VERSION}.nupkg" -exec rm -f {} +
          package_count="$(find "$package_dir" -type f -name "*.${VERSION}.nupkg" ! -name '*.symbols.nupkg' | wc -l | tr -d ' ')"
          if [ "$package_count" = "0" ]; then
            echo "No NuGet packages for resolved version $VERSION were produced in $package_dir." >&2
            exit 1
          fi
          echo "Packed $package_count package(s) for version $VERSION into $package_dir."
          find "$package_dir" -type f -name "*.${VERSION}.nupkg" ! -name '*.symbols.nupkg' | sort

      - name: Push packages to nuget.org
        shell: bash
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_ORG_API_KEY:-}" ]; then
            echo "NUGET_ORG_API_KEY repository secret is required." >&2
            exit 1
          fi
          package_dir="${PACKAGE_OUTPUT%/}/${VERSION}"
          mapfile -t packages < <(find "$package_dir" -type f -name "*.${VERSION}.nupkg" ! -name '*.symbols.nupkg' | sort)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages found for version $VERSION." >&2
            exit 1
          fi
          echo "Pushing ${#packages[@]} package(s) for version $VERSION to nuget.org."
          printf '%s\0' "${packages[@]}" | xargs -0 -n 1 -P "$NUGET_PUSH_PARALLELISM" sh -c '
            package="$1"
            for attempt in 1 2 3; do
              if dotnet nuget push "$package" \
                --source "$NUGET_ORG_SOURCE_URL" \
                --api-key "$NUGET_ORG_API_KEY" \
                --skip-duplicate; then
                exit 0
              fi
              echo "Push failed for $package (attempt $attempt/3)." >&2
              sleep $((attempt * 5))
            done
            exit 1
          ' sh
